name: Bug report
description: Report a reproducible problem in XTend.search
body:
  - type: input
    id: version
    attributes:
      label: Frontend and backend versions
      placeholder: frontend 0.4.1, backend 0.4.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include search mode, filters, browser and deployment method as relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, cookies, private URLs and personal data before posting.
