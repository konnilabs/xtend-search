name: XTend.search CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/xtend-search-0.5.1, codex/release-0.7.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtend-search-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xtend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: xtend/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build Maraca search and Observatory
        run: npm run build:control
      - name: Run application and contract tests
        run: npm run test:control

  searxng-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build reviewed backend and test modified SearXNG contracts offline
        run: sh xtend/tests/control/upstream-gate.sh

  docker-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install browser test dependencies
        working-directory: xtend
        run: |
          npm install --global npm@11.17.0
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build paired release images
        run: |
          fixture_image="xtend-search:$(node -p "require('./xtend/package.json').version")"
          docker build -f Dockerfile.control -t "$fixture_image" .
          docker build -f Dockerfile.searxng -t xtend-search-searxng:0.7.5 .
          echo "FIXTURE_IMAGE=$fixture_image" >> "$GITHUB_ENV"
      - name: Run isolated OAuth, XScaler and responsive UI gates
        env:
          FIXTURE_SETTINGS: xtend/config/settings.control.v05.fixture.yml
          FIXTURE_DATA_VOLUME: xtend-cp-ci
          FIXTURE_PROBES: "0"
        run: |
          sh xtend/tests/control/docker-fixture.sh
          node xtend/tests/control/proxy-fixture.mjs > /tmp/xtend-proxy.log 2>&1 &
          trap 'kill $! || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8093/health/ready > /dev/null; then break; fi
            sleep 1
          done
          node xtend/tests/control/v04-browser.mjs
          node xtend/tests/control/feedback-readiness-browser.mjs
          node xtend/tests/control/minor-051-browser.mjs
          node xtend/tests/control/release-060-browser.mjs
          node xtend/tests/control/release-075-browser.mjs
          node xtend/tests/control/release-076-browser.mjs
          node xtend/tests/control/image-grid-layout-browser.mjs
          PREVIEW_SIZE_BASELINE=xtend/evidence/control-plane/0.7.6-preview-size-baseline-0.7.5.json node xtend/tests/control/preview-size-browser.mjs
          node xtend/tests/control/availability-feedback-browser.mjs
          node xtend/tests/control/weather-layout-browser.mjs
          node xtend/tests/control/spinner-stream-browser.mjs
          node xtend/tests/control/cache-browser.mjs
          node xtend/tests/control/cache-stale-projection-browser.mjs
          node xtend/tests/control/preferences-browser.mjs
          node xtend/tests/control/release-0.4.2-browser.mjs
          node xtend/tests/control/home-browser.mjs
          node xtend/tests/control/ssr-browser.mjs
          node xtend/tests/control/about-browser.mjs
          node xtend/tests/control/edge-browser.mjs
          node xtend/tests/control/lightbox-resilience-browser.mjs
          node xtend/tests/control/prerelease-audit-browser.mjs
          node xtend/tests/control/empty-state-browser.mjs
          # Provider error gates need independent guards; only reset CI fixtures.
          FIXTURE_DATA_VOLUME=xtend-cp-ci-knowledge sh xtend/tests/control/docker-fixture.sh
          node xtend/tests/control/knowledge-failure-browser.mjs
      - name: Fixture diagnostics
        if: failure()
        run: |
          docker logs --tail 100 xtend-cp-search-test
          docker logs --tail 100 xtend-cp-backend-test
